# 注意：这里**故意不设** -Dfile.encoding=UTF-8。
# 原因：Gradle 把长 classpath 写进 @argfile 时用的是 daemon 的默认字符集，
# 而 JDK 17 的 java 启动器读 @argfile 用的是系统本地字符集（本机中文 Windows 为 GBK）。
# 若 daemon 用 UTF-8 写、启动器用 GBK 读，本工程路径里的「软件开发」会被解码成乱码，
# 导致 JVM 单元测试报 ClassNotFoundException（构建 APK 不受影响，因为不走 @argfile）。
# 源码编码不依赖此设置：Kotlin 固定 UTF-8，javac 由 AGP 显式传 -encoding UTF-8。
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official
# 本工程位于含中文的目录（.../软件开发/OmniBox），AGP 8.7 默认会因非 ASCII 路径
# 直接中止配置阶段（b.android.com/95744）。该开关允许在中文路径下构建；
# 若后续 aapt2 / NDK 出现路径编码问题，改用 ASCII 目录联接（junction）指向本工程。
android.overridePathCheck=true
# 本项目禁止网络权限，依赖中的传递权限由 Manifest 合并检查兜底（见 app/build.gradle.kts）
