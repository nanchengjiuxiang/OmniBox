name: OmniBox Android Build

# 云端出 APK：零本机 Android SDK。
# 默认产物 = 可直接 adb 安装/侧载的 debug APK（自动 debug 签名，不需要任何 Secrets）。
# 需要上架级 release 包时在 workflow_dispatch 勾选 build_release 并配置 4 个签名 Secrets。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: '构建签名 release APK（需先配置 5 个签名 Secrets）'
        type: boolean
        default: false
      build_aab:
        description: '额外构建 AAB（同样需要签名 Secrets）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: omnibox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 不要在这里覆盖 ANDROID_HOME：android-actions/setup-android 会把 SDK 装到
    # runner 预置的 /usr/local/lib/android/sdk 并写入环境变量，手动覆盖会让 SDK 找不到。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 提供 gradle 8.9 命令（wrapper jar 缺失时用于现场生成）+ Gradle 依赖缓存
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E 'android-35|build-tools;35|platform-tools' || true

      - name: Ensure Gradle Wrapper is present
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::warning::wrapper jar 不在版本库中，使用 Gradle 8.9 现场生成"
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Static project check
        run: python3 scripts/check-project.py

      - name: Source-level offline gate
        run: ./gradlew :verifyNoInternetPermission :app:assertOfflineManifest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assert merged manifest has no INTERNET
        run: |
          set -euo pipefail
          MAP=$(find app/build/intermediates -type f -name AndroidManifest.xml -path '*merged*' 2>/dev/null || true)
          if [ -z "$MAP" ]; then
            echo "::warning::未找到 merged manifest，跳过构建产物级检查（请人工复核）"
          else
            while IFS= read -r m; do
              echo "Checking $m"
              if grep -qi 'android.permission.INTERNET' "$m"; then
                echo "::error::INTERNET 权限被传递依赖注入了合并后的 Manifest: $m"
                exit 1
              fi
            done <<< "$MAP"
            echo "OK: 合并后的 Manifest 零网络权限"
          fi

      - name: Decode release keystore
        if: ${{ inputs.build_release || inputs.build_aab }}
        env:
          KS_B64: ${{ secrets.OMNIBOX_KS_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "::error::缺少 Secret OMNIBOX_KS_B64（release keystore 的 base64 编码）"
            exit 1
          fi
          KS="$RUNNER_TEMP/omnibox-release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          if [ ! -s "$KS" ]; then
            echo "::error::keystore 解码结果为空，检查 OMNIBOX_KS_B64 是否是纯 base64（无换行/无 data: 前缀）"
            exit 1
          fi
          echo "OMNIBOX_KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "keystore 解码完成: $(wc -c < "$KS") 字节"

      - name: Build signed release APK
        if: ${{ inputs.build_release || inputs.build_aab }}
        env:
          OMNIBOX_KS_PASS: ${{ secrets.OMNIBOX_KS_PASS }}
          OMNIBOX_KEY_ALIAS: ${{ secrets.OMNIBOX_KEY_ALIAS }}
          OMNIBOX_KEY_PASS: ${{ secrets.OMNIBOX_KEY_PASS }}
        run: |
          set -euo pipefail
          for v in OMNIBOX_KS_PATH OMNIBOX_KS_PASS OMNIBOX_KEY_ALIAS OMNIBOX_KEY_PASS; do
            if [ -z "${!v:-}" ]; then
              echo "::error::缺少签名配置 $v，请在仓库 Settings → Secrets 中补齐"
              exit 1
            fi
          done
          ./gradlew :app:assembleRelease --stacktrace

      - name: Build AAB
        if: ${{ inputs.build_aab }}
        env:
          OMNIBOX_KS_PASS: ${{ secrets.OMNIBOX_KS_PASS }}
          OMNIBOX_KEY_ALIAS: ${{ secrets.OMNIBOX_KEY_ALIAS }}
          OMNIBOX_KEY_PASS: ${{ secrets.OMNIBOX_KEY_PASS }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify release signature
        if: ${{ inputs.build_release || inputs.build_aab }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::未生成签名 APK（可能被输出为 app-release-unsigned.apk，说明签名配置未生效）"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "=== 产物哈希 ==="
          sha256sum "$APK"
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec sha256sum {} \;

      - name: Upload debug APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: omnibox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release artifacts
        if: ${{ always() && (inputs.build_release || inputs.build_aab) }}
        uses: actions/upload-artifact@v4
        with:
          name: omnibox-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: omnibox-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
